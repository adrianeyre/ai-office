# AI Office for development, every service in Docker: `pnpm dev`
# (docker/dev.ts) runs it in the foreground, and Ctrl+C stops it. The web
# app is at https://ai-office.localhost (AI_OFFICE_DEV_PUBLIC_URL), which
# serves its /api and the AI Gateway's /v1 paths too, as the app does
# under docker-compose.yml.
#
# - `proxy` is Caddy, serving HTTPS on 443 (AI_OFFICE_DEV_HTTPS_PORT) with a
#   certificate from its own local CA, and redirecting HTTP on 80
#   (AI_OFFICE_DEV_HTTP_PORT) to it (docker/dev/Caddyfile).
# - `web` is Vite, which reloads the web app on change and proxies /api,
#   /health and /v1 to `server`.
# - `server` is the server and the AI Gateway, restarted on change (`node
#   --watch`), with the schema applied as it starts.
# - `deps` installs the workspace's dependencies first, into volumes of
#   their own (docker/dev/Dockerfile says why).
# - `postgres`, on 127.0.0.1:3048, with the credentials .env.example's
#   DATABASE_URL uses, so `pnpm db:schema` and the tests reach it from the
#   host. `pnpm db:down` stops the stack; the data stays in the
#   `postgres-data` volume of the `ai-office-dev` project until `pnpm
#   db:reset`. The image is docker-compose.yml's, pinned by the same digest.
# - `sandbox-relay`, as under docker-compose.yml: the sandboxes' way to the
#   AI Gateway (server:3047) and, through its HTTPS proxy, to the hosts
#   SANDBOX_EGRESS_HOSTS names (docker/sandbox-relay/relay.ts).
#
# The sources are bind-mounted, and the server and Vite run as the user
# that runs `pnpm dev` (AI_OFFICE_DEV_UID and AI_OFFICE_DEV_GID, which
# docker/dev.ts sets), so the sandbox images `pnpm dev` builds for that
# user fit the clones the server makes. The server starts Agents' sandboxes
# with the host's Docker (the socket below; docker/dev.ts sets
# AI_OFFICE_DEV_DOCKER_GID to its group), in AI_OFFICE_DEV_SANDBOX_DIR, which
# is at the same path inside as on the host.
#
# It runs beside a docker-compose.yml stack on the same machine without
# touching it: its own project (`ai-office-dev`), volumes and sandbox
# network (`ai-office-dev-sandboxes`, so each stack's server finds its own
# relay and sweeps only its own sandboxes' networks), and its own sandbox
# directory. Only the published ports can clash: give
# AI_OFFICE_DEV_HTTPS_PORT, AI_OFFICE_DEV_HTTP_PORT and
# AI_OFFICE_DEV_OAUTH_PORT other values in .env when something else on this
# machine has 443, 80 or 1455.
name: ai-office-dev

x-dev: &dev
  build:
    context: .
    dockerfile: docker/dev/Dockerfile
  image: ai-office-dev:local
  user: ${AI_OFFICE_DEV_UID:-1000}:${AI_OFFICE_DEV_GID:-1000}
  init: true
  working_dir: /app
  volumes:
    - .:/app
    - pnpm-store:/pnpm-store
    - node-modules:/app/node_modules
    - node-modules-server:/app/apps/server/node_modules
    - node-modules-web:/app/apps/web/node_modules
    - node-modules-communications:/app/packages/communications/node_modules
    - node-modules-db:/app/packages/db/node_modules
    - node-modules-events:/app/packages/events/node_modules
    - node-modules-gateway:/app/packages/gateway/node_modules
    - node-modules-github:/app/packages/github/node_modules
    - node-modules-orchestrator:/app/packages/orchestrator/node_modules
    - node-modules-shared:/app/packages/shared/node_modules
    - node-modules-e2e:/app/e2e/node_modules

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: ai_office
      POSTGRES_USER: ai_office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - 127.0.0.1:3048:5432
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=ai_office", "--dbname=ai_office"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # The workspace's dependencies, as pnpm-lock.yaml has them, then exits;
  # quick when nothing has changed.
  deps:
    <<: *dev
    command:
      - pnpm
      - install
      - --frozen-lockfile
      - --store-dir=/pnpm-store
      - --config.package-import-method=copy
      - --config.confirmModulesPurge=false
    restart: "no"

  server:
    <<: *dev
    depends_on:
      postgres:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - node packages/db/src/apply-schema-cli.ts && exec node --watch apps/server/src/main.ts
    # .env's values, if there is one (`pnpm dev` copies .env.example when
    # there is not), but those below are this stack's, whatever it says.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://ai_office:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/ai_office
      HOST: 0.0.0.0
      PORT: "3046"
      # `proxy` is published to the host's loopback only: what tells the
      # server it is not served beyond this machine.
      PUBLISHED_ADDRESS: 127.0.0.1
      PUBLIC_URL: ${AI_OFFICE_DEV_PUBLIC_URL:-https://ai-office.localhost}
      # The AI Gateway's own port, for the sandboxes only, through the
      # sandbox relay (server:3047); never published.
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "3047"
      # ChatGPT's sign-in ends on localhost:1455, published below.
      OAUTH_CALLBACK_HOST: 0.0.0.0
      SANDBOX_GATEWAY_URL: http://sandbox-relay:3047
      SANDBOX_NETWORK: ai-office-dev-sandboxes
      SANDBOX_WORK_DIR: ${AI_OFFICE_DEV_SANDBOX_DIR:-${HOME}/.ai-office/dev-sandboxes}
    ports:
      - 127.0.0.1:${AI_OFFICE_DEV_OAUTH_PORT:-1455}:1455
    expose:
      - "3046"
      - "3047"
    # Your own Ollama, say, as under Docker Desktop: add
    # host.docker.internal to ALLOWED_INTERNAL_HOSTS to use it.
    extra_hosts:
      - host.docker.internal:host-gateway
    # The development image's volumes, as x-dev has them (compose cannot
    # extend a list), and the host's Docker and the sandbox directory.
    volumes:
      - .:/app
      - pnpm-store:/pnpm-store
      - node-modules:/app/node_modules
      - node-modules-server:/app/apps/server/node_modules
      - node-modules-web:/app/apps/web/node_modules
      - node-modules-communications:/app/packages/communications/node_modules
      - node-modules-db:/app/packages/db/node_modules
      - node-modules-events:/app/packages/events/node_modules
      - node-modules-gateway:/app/packages/gateway/node_modules
      - node-modules-github:/app/packages/github/node_modules
      - node-modules-orchestrator:/app/packages/orchestrator/node_modules
      - node-modules-shared:/app/packages/shared/node_modules
      - node-modules-e2e:/app/e2e/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AI_OFFICE_DEV_SANDBOX_DIR:-${HOME}/.ai-office/dev-sandboxes}:${AI_OFFICE_DEV_SANDBOX_DIR:-${HOME}/.ai-office/dev-sandboxes}
    group_add:
      - ${AI_OFFICE_DEV_DOCKER_GID:-0}
    networks:
      - default
    restart: unless-stopped

  web:
    <<: *dev
    depends_on:
      deps:
        condition: service_completed_successfully
    # Behind `proxy`, so not published: its hot reload connects to the
    # public address (PUBLIC_URL), which `proxy` passes on.
    command:
      - pnpm
      - --filter
      - "@ai-office/web"
      - exec
      - vite
      - --host
      - 0.0.0.0
    environment:
      AI_OFFICE_SERVER_URL: http://server:3046
      PUBLIC_URL: ${AI_OFFICE_DEV_PUBLIC_URL:-https://ai-office.localhost}
    expose:
      - "3045"
    networks:
      - default
    restart: unless-stopped

  # The one entry point: the web app, /api and the AI Gateway's /v1, over
  # HTTPS. Its local CA and certificates are kept in
  # AI_OFFICE_DEV_CADDY_DIR, so the root you trust survives restarts.
  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    user: ${AI_OFFICE_DEV_UID:-1000}:${AI_OFFICE_DEV_GID:-1000}
    depends_on:
      - web
    environment:
      AI_OFFICE_DEV_PUBLIC_URL: ${AI_OFFICE_DEV_PUBLIC_URL:-https://ai-office.localhost}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /data/config
    ports:
      - 127.0.0.1:${AI_OFFICE_DEV_HTTPS_PORT:-443}:8443
      - 127.0.0.1:${AI_OFFICE_DEV_HTTP_PORT:-80}:8080
    volumes:
      - ./docker/dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AI_OFFICE_DEV_CADDY_DIR:-${HOME}/.ai-office/dev-caddy}:/data
    # The image's caddy carries the file capability to bind low ports, which
    # Linux refuses to run without it in the bounding set; it is not used,
    # as Caddy listens on 8443 and 8080.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    restart: unless-stopped

  sandbox-relay:
    image: node:26.10.0-slim@sha256:930557a230abacbc3f4fd9b8648abf8f4bee1e17cb72195dcdfb2f709bc85b33
    user: node
    command: ["node", "/relay/relay.ts"]
    environment:
      RELAY_GATEWAY: server:3047
      SANDBOX_EGRESS_HOSTS: ${SANDBOX_EGRESS_HOSTS:-}
    volumes:
      - ./docker/sandbox-relay/relay.ts:/relay/relay.ts:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - sandboxes
    restart: unless-stopped

volumes:
  postgres-data:
  pnpm-store:
  node-modules:
  node-modules-server:
  node-modules-web:
  node-modules-communications:
  node-modules-db:
  node-modules-events:
  node-modules-gateway:
  node-modules-github:
  node-modules-orchestrator:
  node-modules-shared:
  node-modules-e2e:

networks:
  # The sandbox relay's network (the server's SANDBOX_NETWORK); each sandbox
  # has an internal network of its own, which the relay joins (ADR 0006).
  # Internal, and with inter-container traffic off: nothing else is on it.
  # Not docker-compose.yml's ai-office-sandboxes, so the two stacks never
  # share a relay or sweep each other's sandboxes' networks.
  sandboxes:
    name: ai-office-dev-sandboxes
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
