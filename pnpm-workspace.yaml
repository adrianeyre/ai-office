packages:
  - apps/*
  - packages/*
  - e2e
  - site

# tsx depends on esbuild, whose postinstall fetches its platform binary.
# Testcontainers pulls in ssh2 (and its optional cpu-features), whose install
# scripts only build optional native speed-ups, and protobufjs, whose
# postinstall only checks versions; none of them is needed, so they stay off.
allowBuilds:
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# The latest conventionalcommits preset renders release notes only with
# conventional-changelog-writer 9, and the latest release-notes-generator and
# commit-analyzer, which semantic-release brings, still ask for 8. Drop this
# once they take 9.
overrides:
  conventional-changelog-writer: ^9.3.0
